name: GlobalBase Patch Build

on:
  push:
    branches:
      - codex/globalbase-review-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply reviewed patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > reviewed.patch
          git apply --binary reviewed.patch
          git diff --check
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild GlobalBase.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Verify requested UTF-8 BOM files
        shell: python
        run: |
          from pathlib import Path
          for file_name in ('GB_Point2d.h', 'GB_Matrix3x3.h', 'GB_Vector2d.h'):
              path = Path('GlobalBase/Geometry') / file_name
              if not path.read_bytes().startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'{path} is not UTF-8 with BOM')
