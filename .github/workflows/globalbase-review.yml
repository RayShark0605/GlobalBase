name: GlobalBase Review

on:
  push:
    branches:
      - codex/globalbase-review-20260806
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globalbase-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Prepare source list
        shell: bash
        run: |
          mkdir -p review-output source-snapshot
          find GlobalBase/CV GlobalBase/Geometry GlobalBase/Desktop -maxdepth 1 -type f \( -name '*.h' -o -name '*.cpp' \) -print | sort > review-output/source-files.txt
          while IFS= read -r sourceFile; do
            mkdir -p "source-snapshot/$(dirname "$sourceFile")"
            cp "$sourceFile" "source-snapshot/$sourceFile"
          done < review-output/source-files.txt
          cp CMakeLists.txt source-snapshot/CMakeLists.txt
          mkdir -p source-snapshot/GlobalBase
          cp GlobalBase/CMakeLists.txt GlobalBase/GlobalBase.vcxproj source-snapshot/GlobalBase/
      - name: Run cppcheck
        shell: bash
        run: |
          mapfile -t SOURCES < review-output/source-files.txt
          cppcheck --std=c++14 --platform=win64 --enable=warning,performance,portability --inconclusive --inline-suppr --suppress=missingInclude --suppress=missingIncludeSystem --max-configs=12 --template='{file}:{line}: {severity}: {id}: {message}' "${SOURCES[@]}" 2> review-output/cppcheck.txt || true
      - name: Inspect C++14 compatibility and encodings
        shell: python
        run: |
          from pathlib import Path
          files = [Path(line) for line in Path('review-output/source-files.txt').read_text(encoding='utf-8').splitlines()]
          encoding_lines = []
          compatibility_lines = []
          patterns = {
              'if constexpr': 'C++17 if constexpr',
              'std::optional': 'C++17 std::optional',
              'std::variant': 'C++17 std::variant',
              'std::string_view': 'C++17 std::string_view',
              'std::filesystem': 'C++17 std::filesystem',
              'std::is_same_v': 'C++17 variable template helper',
              'std::is_integral_v': 'C++17 variable template helper',
              'std::clamp(': 'C++17 std::clamp',
              'std::scoped_lock': 'C++17 std::scoped_lock',
              'std::shared_mutex': 'C++17 std::shared_mutex',
          }
          for path in files:
              data = path.read_bytes()
              has_bom = data.startswith(b'\xef\xbb\xbf')
              try:
                  text = data.decode('utf-8-sig')
                  valid_utf8 = True
              except UnicodeDecodeError:
                  text = ''
                  valid_utf8 = False
              non_ascii = any(byte >= 0x80 for byte in data)
              encoding_lines.append(f'{path}\tutf8={valid_utf8}\tbom={has_bom}\tnon_ascii={non_ascii}\tbytes={len(data)}')
              if valid_utf8:
                  for line_number, line in enumerate(text.splitlines(), 1):
                      for pattern, description in patterns.items():
                          if pattern in line:
                              compatibility_lines.append(f'{path}:{line_number}: {description}: {line.strip()}')
          Path('review-output/encodings.txt').write_text('\n'.join(encoding_lines) + '\n', encoding='utf-8')
          Path('review-output/cpp14-compatibility.txt').write_text('\n'.join(compatibility_lines) + ('\n' if compatibility_lines else ''), encoding='utf-8')
      - name: Build source inventory
        shell: bash
        run: |
          xargs -d '\n' wc -l < review-output/source-files.txt > review-output/source-lines.txt
          grep -RInE --include='*.h' --include='*.cpp' '(memcpy|memmove|reinterpret_cast|detach\(|SetDllDirectory|WaitForSingleObject|OpenClipboard|GlobalLock|new\[|delete\[)' GlobalBase/CV GlobalBase/Geometry GlobalBase/Desktop > review-output/risky-patterns.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: globalbase-static-review
          path: review-output
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: globalbase-source-snapshot
          path: source-snapshot
          if-no-files-found: error
